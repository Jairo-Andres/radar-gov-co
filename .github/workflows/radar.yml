name: Radar semanal

on:
  schedule:
    # Lunes 11:00 UTC = 6:00 a. m. en Colombia (poco tráfico en los portales).
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "IDs separados por coma (vacío = todos los de sites.yaml)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  audit:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          npm ci
          python -m playwright install --with-deps chromium

      - name: Auditar portales
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python -m radar run --only "$ONLY"
          else
            python -m radar run
          fi

      # Los hallazgos de seguridad quedan en private/ (ignorado por git) y NO se publican.
      # Solo se avisa que existen para revisarlos a mano con la ejecución local.
      - name: Avisar si hubo posibles hallazgos de seguridad
        if: always()
        run: |
          if ls private/security-notes-*.json >/dev/null 2>&1; then
            echo "::warning::Hubo posibles hallazgos de seguridad. No se publicaron; revisa ejecutando el Radar en local."
          fi

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
          else
            git commit -m "data: resultados del Radar $(date -u +%F)"
            git push
          fi

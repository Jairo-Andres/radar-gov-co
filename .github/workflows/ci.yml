name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  auditor:
    name: Tests del auditor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  web:
    name: Tests de la web (Playwright + axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: |
          pip install -r requirements.txt
          npm ci
          python -m playwright install --with-deps chromium
      - run: python -m pytest tests_web -q

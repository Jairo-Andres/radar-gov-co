# Portales auditados por el Radar .gov.co.
# Verificados el 2026-10-04 con `python -m radar verify` (responden y robots.txt permite la visita).
# `pages` (opcional): hasta 2 páginas internas fijas; si no se indica, se eligen las 2 primeras
# del menú que robots.txt permita. El código nunca visita más de 3 páginas por sitio.
settings:
  pause_seconds: 5   # mínimo 3, lo impone el código
  max_pages: 3       # máximo 3, lo impone el código
  official_origin: github-actions   # serie que publica la web (ver README: Desde dónde se mide)
sites:
